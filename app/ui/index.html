<!doctype html>
<html lang="en">

  <title>Takeaway Service</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script defer src="/ui/vendor/vue-3.5.13.global.prod.js"></script>

</head>
<body>
  <div id="app" v-cloak>

      <strong>Takeaway Service</strong>
      <nav aria-label="Main navigation">
