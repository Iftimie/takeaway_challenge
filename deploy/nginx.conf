log_format request_summary escape=json '{"request_id":"$upstream_http_x_request_id","status":$status,"duration_s":$request_time}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout request_summary;
    # Nginx error messages may include raw URLs and client addresses.
    error_log /dev/null;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
