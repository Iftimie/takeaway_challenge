name: PR checks and infrastructure promotion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Merged releases, including the approval wait, run one at a time.
# PR checks use a separate group and never cancel a running apply.
concurrency:
  group: pipeline-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  AWS_EC2_METADATA_DISABLED: 'true'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  tests:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      publish: ${{ needs.changes.outputs.release == 'true' }}
    permissions:
      contents: read
      packages: write

  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infrastructure: ${{ steps.files.outputs.infrastructure }}
      release: ${{ steps.files.outputs.release }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            PR_NUMBER=$(gh api --paginate "repos/$REPOSITORY/commits/$GITHUB_SHA/pulls" | jq -sr --arg sha "$GITHUB_SHA" 'add | map(select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)) | .[0].number // empty')
            if [ -z "$PR_NUMBER" ]; then
              echo 'No merged PR matches this main commit; deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
              echo 'release=false' >> "$GITHUB_OUTPUT"
              echo 'infrastructure=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" | jq -s 'add | any(.[]; [.filename, (.previous_filename // "")] | any(.[]; startswith("infra/server/") or startswith(".github/")))')
          echo "infrastructure=$changed" >> "$GITHUB_OUTPUT"

  terraform-validation:
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - name: Validate without AWS credentials (including fork PRs)
        working-directory: infra/server
        run: |
          terraform init -backend=false -lockfile=readonly -no-color
          terraform fmt -check -recursive
          bash -n bootstrap.sh.tftpl
          terraform validate -no-color
          terraform test -no-color

  qa-plan:
    needs: [changes, terraform-validation]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: qa
    concurrency:
      group: terraform-qa
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_environment: qa
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-setup
        with:
          environment: qa
      - name: Review QA changes
        working-directory: infra/server
        run: |
          set -o pipefail
          terraform plan -lock-timeout=60s -no-color | tee qa-plan.txt
          echo '### QA plan (review only)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat qa-plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  qa-apply:
    needs: [tests, changes, terraform-validation]
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: qa
    concurrency:
      group: terraform-qa
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_environment: qa
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-setup
        with:
          environment: qa
      - name: Plan merged code and apply QA
        working-directory: infra/server
        run: |
          terraform plan -lock-timeout=60s -no-color -out=qa.tfplan
          terraform apply -lock-timeout=60s -no-color qa.tfplan
          ip=$(terraform output -raw public_ip)
          printf 'QA server: `%s` (cloud-init and SSH verification still required).\n' "$ip" >> "$GITHUB_STEP_SUMMARY"

  prod-apply:
    needs: qa-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Approval gates the entire production job, including its fresh plan.
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_environment: prod
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-setup
        with:
          environment: prod
      - name: Reject an outdated release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'main changed while approval was pending. Run the latest merged-code pipeline and approve production again.' >&2
            exit 1
          fi
      - name: Plan and apply production after approval
        working-directory: infra/server
        run: |
          terraform plan -lock-timeout=60s -no-color -out=prod.tfplan
          terraform apply -lock-timeout=60s -no-color prod.tfplan
          ip=$(terraform output -raw public_ip)
          printf 'Production server: `%s` (cloud-init and SSH verification still required).\n' "$ip" >> "$GITHUB_STEP_SUMMARY"
