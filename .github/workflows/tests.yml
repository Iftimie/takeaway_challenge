name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Disposable test database only; no deployment secrets are needed.
      POSTGRES_DB: takeaway_browser_test
      POSTGRES_USER: browser_test
      POSTGRES_PASSWORD: browser_test_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '55432'
      JWT_SECRET: browser-test-only-jwt-key-not-for-production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and build UI
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install '.[test]'
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start disposable PostgreSQL and migrate
        run: .venv/bin/python tests/browser_db.py prepare
      - name: Python tests (including database integration)
        run: .venv/bin/python -m pytest -q --tb=short --junitxml=ci-results/pytest.xml
      - name: JavaScript unit tests
        run: npm run test:unit
      - name: Browser tests through Docker and Nginx
        env:
          UI_TEST_COMPOSE: '1'
        run: npm run test:browser
      - name: Remove disposable test stack
        if: always()
        run: docker compose -p takeaway-browser-tests -f compose.browser-tests.yaml --profile full down --volumes --remove-orphans
      - name: Upload failure reports and browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-reports
          path: |
            ci-results/
            playwright-report/
            test-results/
          retention-days: 7
      - name: Export tested image
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: docker save takeaway-service:browser-tests | gzip > tested-image.tar.gz
      - name: Transfer tested image to publishing job
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/upload-artifact@v7
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish tested image
    needs: tests
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - name: Load and tag tested image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker load --input tested-image.tar.gz
          docker tag takeaway-service:browser-tests "ghcr.io/iftimie/takeaway_challenge:$COMMIT_SHA"
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin
      - name: Push and record digest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/iftimie/takeaway_challenge:$COMMIT_SHA"
          docker push "$image"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          test -n "$reference"
          echo "### Published tested image" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull/deploy reference: \`$reference\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
