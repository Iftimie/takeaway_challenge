services:
  app:
    profiles: [full]
    build: .
    image: takeaway-service:browser-tests
    environment:
      POSTGRES_DB: takeaway_browser_test
      POSTGRES_USER: browser_test
      POSTGRES_PASSWORD: browser_test_only
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: browser-test-only-jwt-key-not-for-production
    depends_on:
      db:
        condition: service_healthy
  nginx:
    profiles: [full]
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8877:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 1s
      timeout: 3s
      retries: 30
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: takeaway_browser_test
      POSTGRES_USER: browser_test
      POSTGRES_PASSWORD: browser_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browser_test -d takeaway_browser_test"]
      interval: 1s
      timeout: 3s
      retries: 30
